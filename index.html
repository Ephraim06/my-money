<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Money</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
      <header class="mb-8">
        <h1 class="text-3xl font-bold text-indigo-800">Money Tracker</h1>
        <p class="text-gray-600">Track every rand you spend and earn</p>
      </header>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Summary Cards -->
        <div class="bg-white rounded-lg shadow p-6 md:col-span-3">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-indigo-50 rounded-lg p-4">
              <h3 class="text-sm font-medium text-indigo-700">
                Monthly Income
              </h3>
              <p class="text-2xl font-bold text-indigo-900" id="monthly-income">
                R0.00
              </p>
            </div>
            <div class="bg-green-50 rounded-lg p-4">
              <h3 class="text-sm font-medium text-green-700">
                Current Balance
              </h3>
              <p class="text-2xl font-bold text-green-900" id="current-balance">
                R0.00
              </p>
            </div>
            <div class="bg-red-50 rounded-lg p-4">
              <h3 class="text-sm font-medium text-red-700">Total Expenses</h3>
              <p class="text-2xl font-bold text-red-900" id="total-expenses">
                R0.00
              </p>
            </div>
          </div>
        </div>

        <!-- Set Income Form -->
        <div class="bg-white rounded-lg shadow p-6">
          <h2 class="text-xl font-semibold mb-4 text-gray-800">
            Set Monthly Income
          </h2>
          <form id="income-form" class="space-y-4">
            <div>
              <label
                for="income-amount"
                class="block text-sm font-medium text-gray-700"
                >Amount (ZAR)</label
              >
              <input
                type="number"
                step="0.01"
                id="income-amount"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
              />
            </div>
            <button
              type="submit"
              class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
            >
              Set Income
            </button>
          </form>
        </div>

        <!-- Add Transaction Form -->
        <div class="bg-white rounded-lg shadow p-6">
          <h2 class="text-xl font-semibold mb-4 text-gray-800">
            Add Transaction
          </h2>
          <form id="transaction-form" class="space-y-4">
            <div>
              <label
                for="transaction-type"
                class="block text-sm font-medium text-gray-700"
                >Type</label
              >
              <select
                id="transaction-type"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
              >
                <option value="expense">Expense</option>
                <option value="income">Additional Income</option>
              </select>
            </div>
            <div>
              <label
                for="transaction-amount"
                class="block text-sm font-medium text-gray-700"
                >Amount (ZAR)</label
              >
              <input
                type="number"
                step="0.01"
                id="transaction-amount"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
                required
              />
            </div>
            <div>
              <label
                for="transaction-description"
                class="block text-sm font-medium text-gray-700"
                >Description</label
              >
              <input
                type="text"
                id="transaction-description"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
                required
              />
            </div>
            <div>
              <label
                for="transaction-category"
                class="block text-sm font-medium text-gray-700"
                >Category</label
              >
              <select
                id="transaction-category"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
              >
                <option value="shopping">Shopping</option>
                <option value="food">Food</option>
                <option value="transport">Transport</option>
                <option value="bills">Bills</option>
                <option value="entertainment">Entertainment</option>
                <option value="freelance">Freelance Income</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div>
              <label
                for="transaction-date"
                class="block text-sm font-medium text-gray-700"
                >Date</label
              >
              <input
                type="date"
                id="transaction-date"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
                required
              />
            </div>
            <button
              type="submit"
              class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
            >
              Add Transaction
            </button>
          </form>
        </div>

        <!-- Stats and Chart -->
        <div class="bg-white rounded-lg shadow p-6 md:col-span-1">
          <h2 class="text-xl font-semibold mb-4 text-gray-800">
            Monthly Stats
          </h2>
          <div class="space-y-4">
            <div>
              <h3 class="text-sm font-medium text-gray-700">
                Remaining Budget
              </h3>
              <p class="text-xl font-bold" id="remaining-budget">R0.00</p>
            </div>
            <div>
              <h3 class="text-sm font-medium text-gray-700">Daily Average</h3>
              <p class="text-xl font-bold" id="daily-average">R0.00</p>
            </div>
            <div class="h-40">
              <canvas id="categoryChart"></canvas>
            </div>
          </div>
        </div>

        <!-- Transactions List -->
        <div class="bg-white rounded-lg shadow p-6 md:col-span-3">
          <h2 class="text-xl font-semibold mb-4 text-gray-800">
            Recent Transactions
          </h2>
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
                <tr>
                  <th
                    scope="col"
                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Date
                  </th>
                  <th
                    scope="col"
                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Description
                  </th>
                  <th
                    scope="col"
                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Category
                  </th>
                  <th
                    scope="col"
                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Amount
                  </th>
                  <th
                    scope="col"
                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Action
                  </th>
                </tr>
              </thead>
              <tbody
                id="transactions-list"
                class="bg-white divide-y divide-gray-200"
              >
                <!-- Transactions will be added here dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
